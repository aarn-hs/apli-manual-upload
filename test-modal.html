<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Webhook Response</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simular el estilo del modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 28rem;
            width: 90%;
            padding: 1.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<!-- Modal de Éxito -->
<div class="modal-backdrop">
    <div class="modal-content">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <svg class="h-5 w-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h2 class="text-lg font-semibold">Candidato Enviado</h2>
            </div>
            <button class="h-6 w-6 text-gray-400 hover:text-gray-600">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Content -->
        <div class="space-y-4">
            <p class="text-sm text-gray-700">
                El candidato ha sido enviado exitosamente al sistema de Apli.
            </p>
            
            <!-- ID de postulación -->
            <div class="p-3 bg-gray-50 rounded-md">
                <p class="text-xs text-gray-600 mb-1">ID de postulación:</p>
                <a href="#" class="text-blue-600 hover:text-blue-800 underline text-sm font-medium">
                    https://demo.apli.app/candidates/ABC123XYZ
                </a>
                <p class="text-xs text-gray-500 mt-1">
                    Haz clic para ver en Apli
                </p>
            </div>
            
            <!-- Mensaje de soporte - NUEVO -->
            <div class="mt-4">
                <p class="text-xs text-gray-500 text-center">
                    ¿Algo falló? Puedes escribirnos y compartir el ID de la solicitud para ayudarte más rápido
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Botones para mostrar diferentes estados -->
<div class="fixed bottom-4 left-4 space-x-2">
    <button onclick="showSuccess()" class="bg-green-600 text-white px-3 py-1 rounded text-sm">Éxito</button>
    <button onclick="showError()" class="bg-red-600 text-white px-3 py-1 rounded text-sm">Error</button>
    <button onclick="showConnection()" class="bg-orange-600 text-white px-3 py-1 rounded text-sm">Conexión</button>
</div>

<script>
function showSuccess() {
    document.querySelector('.modal-content').innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <svg class="h-5 w-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h2 class="text-lg font-semibold">Candidato Enviado</h2>
            </div>
            <button class="h-6 w-6 text-gray-400 hover:text-gray-600">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <div class="space-y-4">
            <p class="text-sm text-gray-700">
                El candidato ha sido enviado exitosamente al sistema de Apli.
            </p>
            
            <div class="p-3 bg-gray-50 rounded-md">
                <p class="text-xs text-gray-600 mb-1">ID de postulación:</p>
                <a href="#" class="text-blue-600 hover:text-blue-800 underline text-sm font-medium">
                    https://demo.apli.app/candidates/ABC123XYZ
                </a>
                <p class="text-xs text-gray-500 mt-1">
                    Haz clic para ver en Apli
                </p>
            </div>
            
            <div class="mt-4">
                <p class="text-xs text-gray-500 text-center">
                    ¿Algo falló? Puedes escribirnos y compartir el ID de la solicitud para ayudarte más rápido
                </p>
            </div>
        </div>
    `;
}

function showError() {
    document.querySelector('.modal-content').innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <svg class="h-5 w-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                </svg>
                <h2 class="text-lg font-semibold">Error al Enviar</h2>
            </div>
            <button class="h-6 w-6 text-gray-400 hover:text-gray-600">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <div class="space-y-4">
            <p class="text-sm text-gray-700">
                No se pudo enviar el candidato. Verifica los datos e intenta nuevamente.
            </p>
            
            <div class="mt-6 pt-3 border-t border-gray-200">
                <p class="text-xs text-gray-500 text-center">
                    ¿Algo falló? Puedes escribirnos y compartir el ID de la solicitud para ayudarte más rápido
                </p>
            </div>
        </div>
    `;
}

function showConnection() {
    document.querySelector('.modal-content').innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <svg class="h-5 w-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192L5.636 18.364M12 2.25a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM12 21a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0112 21z"></path>
                </svg>
                <h2 class="text-lg font-semibold">Error de Conexión</h2>
            </div>
            <button class="h-6 w-6 text-gray-400 hover:text-gray-600">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <div class="space-y-4">
            <p class="text-sm text-gray-700">
                No se pudo conectar con el servidor. Verifica tu conexión a internet.
            </p>
            
            <div class="mt-6 pt-3 border-t border-gray-200">
                <p class="text-xs text-gray-500 text-center">
                    ¿Algo falló? Puedes escribirnos y compartir el ID de la solicitud para ayudarte más rápido
                </p>
            </div>
        </div>
    `;
}
</script>

</body>
</html>
